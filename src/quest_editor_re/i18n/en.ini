editor.help_title = "Quest Editor RE · Help"
editor.help_body = "Quest graph controls\n\nMiddle-drag / Space+drag: pan   Wheel: zoom\nDouble-click a gray cell: create a quest and connect its row neighbors\nDrag a box to another quest: forward creates a main link; backward creates a branch\nDrag to a gray cell: create and connect; node positions stay fixed\nCtrl+click / drag empty space: multiple selection\nClick a line + Delete: disconnect only that line\nRight-click a column gap: toggle a level boundary\nDelete: delete selected quests; row headers are protected\nCtrl+Z / Y: undo / redo   Ctrl+S: save\n\nDouble-click a quest: open its properties; OK applies, Cancel discards.\nUse Raw CFG for repeated conditions and unknown fields.\n\nGame TimeLine and canvas layout are separate.\nDragging does not change quest IDs. Selecting an encoding does not transcode the entire file.\nSee docs in the release directory for full instructions."
