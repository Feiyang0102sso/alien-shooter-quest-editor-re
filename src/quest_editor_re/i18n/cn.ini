editor.help_body = "任务图操作\n\n中键 / 空格+拖动：平移   滚轮：缩放\n双击灰格：在格内创建任务\n双击灰格：自动连接同一行左右任务\n框体拖向其他任务：向后为主连接，向前为支线\n框体拖向灰格：创建任务并连接；节点位置固定\nCtrl+单击 / 拖动空白框选：多选\n单击线 + Delete：只断开该线\n右键两列间隙：创建 / 取消关卡分界\nDelete：删除选中的普通任务；行头受保护\nCtrl+Z / Y：撤销 / 重做   Ctrl+S：保存\n\n双击任务：独立属性窗口，确定提交、取消放弃。\n重复条件和未知字段使用原始块编辑。\n\n游戏时间列与独立画布布局不同！\n编号不随拖动变更。编码选择不自动转码整个文件。\n完整说明见发布目录 docs。"
